<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="utf-8">
    <title>Sample4</title>
    <!--P2Pによる双方向通信ライブラリ、peer.js読み込み-->
    <script src="https://unpkg.com/peerjs@1.4.7/dist/peerjs.min.js"></script>
</head>

<body>
    <script>
        //このプログラムはpeer.jsの仕様上https通信でないと動作しないため、github pagesで公開している
        //https://kazetokaze.github.io/guess-number-game/

        async function main() { //awaitを使うため async 付きで関数として以下全ての処理を定義
            alert("数当てゲームへようこそ\n答えは0から100までの整数のどれかです\n相手より早く答えを当てれば勝ちとなります") //ゲーム説明
            alert("このゲームはオンライン2人プレイです。\nどちらかがホスト、どちらかがクライアントになってください。")
            
            const peer = new Peer() //オンライン接続準備
            const myPeerID = await new Promise(resolve => peer.once("open", resolve)) //自ID取得 イベントリスナーは非同期処理なのでawaitで無理やり同期

            let connection //ホストとクライアントで接続時に使う変数の内容が若干違うため事前に宣言
            const isHost = confirm("あなたはホストですか？ はい→OK いいえ→キャンセル") //ホストとクライアントに振り分け 基本ホストが計算などを行い、クライアントは結果を受けるだけ
            if (isHost) { //ホスト側の処理
                alert(`あなたのPeerIDは ${myPeerID} です。\nクライアント側でこのIDを入力してください。`) //自ID表示
                connection = await new Promise(resolve => peer.once("connection", resolve)) //クライアントの情報の受信を待機
                await new Promise(resolve => connection.once("open", resolve)) //クライアントとの接続を待機
                alert("クライアントとの接続が確立されました。\nゲームを開始します。")

                const hostTime = game() //ホスト側でゲームを実行　かかった時間を記録
                const clientTime = await new Promise(resolve => connection.once("data", resolve)) //クライアント側でかかった時間を受信 待機

                const win = "あなたの勝ちです。" //保守性のため 勝ち 負け 引き分け のメッセージは変数管理
                const draw = "引き分けです。"
                const loss = "あなたの負けです。"
                let hostResult //ホストに表示するメッセージ 内容が可変なので事前宣言
                let clientResult //クライアントに表示するメッセージ 同上
                if (hostTime < clientTime) { //より早くクリアした方が勝ち 結果は小数点以下まで含めた秒で比較
                    hostResult=`相手：${clientTime}秒\nあなた：${hostTime}秒\n${win}` //相手と自分の経過時間も記載
                    clientResult=`相手：${hostTime}秒\nあなた：${clientTime}秒\n${loss}`
                } else if (hostTime == clientTime) {
                    hostResult=`相手：${clientTime}秒\nあなた：${hostTime}秒\n${draw}`
                    clientResult=`相手：${hostTime}秒\nあなた：${clientTime}秒\n${draw}`
                } else {
                    hostResult=`相手：${clientTime}秒\nあなた：${hostTime}秒\n${loss}`
                    clientResult=`相手：${hostTime}秒\nあなた：${clientTime}秒\n${win}`
                }
                connection.send(clientResult) //クライアントに結果を送信
                setTimeout(() => { alert(hostResult) }, 50) //クライアントへの結果送信が終わるまで50ms待ってから結果を表示
                alert("ページを再読み込みすると再戦できます。\n※再度PeerIDの入力が必要になります。")
            } else { //クライアント側の処理
                const partnerId = prompt("あなたはクライアントです。\nホストから提示されたPeerIDを入力してください。") //ホストのIDを入力　エラー時には特に何も起きない
                connection = peer.connect(partnerId) //ホストに情報を送信
                await new Promise(resolve => connection.once("open", resolve)) //ホストとの接続を待機
                alert("ホストとの接続が確立されました。\nゲームを開始します。")

                const resultTime = game() //クライアント側でゲームを実行 かかった時間を記録
                connection.send(resultTime) //ホストにかかった時間を送信

                const result = await new Promise(resolve => connection.once("data", resolve)) //ホストからの結果の受信を待機
                alert(result) //結果表示
                alert("ページを再読み込みすると再戦できます。\n※再度PeerIDの入力が必要になります。")
            }
        }

        function game() { //ゲーム本体は別関数として定義　かかった時間のみを取り出すことが楽にできる
            var number = Math.floor(Math.random() * 101) //0から100までのランダムな整数を答えに
            let answer //再代入可能変数を事前に宣言
            let errorMessage //同上
            var turn = 1

            const startTime = Date.now() //開始時刻を記録

            while (answer != number) { //無限ループ !==を使わないことで文字列の回答を数字として処理
                answer = prompt(`${errorMessage ? `${errorMessage}\n` : ""}現在${turn}ターン目です`)
                //エラーがあった時のみターン数と合わせてエラー内容も表示する　簡易的な条件分岐を使用
                
                if (answer === null || answer.trim() === "") { //別のページ閲覧中などに空入力が繰り返され勝手にターン数が進む現象を修正
                    continue
                } else if (isNaN(Number(answer))) { //文字などの入力はターン数を進めない
                    errorMessage = "半角数字を答えてください"
                    continue
                } else if (answer < 0 || answer > 100) { //範囲外の入力はターン数を進めない
                    errorMessage = "0から100までの数字を答えてください"
                    continue
                } else if (!Number.isInteger(Number(answer))) { //少数の入力はターン数を進めない
                    errorMessage = "整数を答えてください"
                    continue
                } else if (answer == number) { //回答が一致した時のみあたりと表示　厳密な比較を行わないことで多少の表記揺れを妥協
                    const endTime = Date.now() //あたりのダイアログを出す前に終了時刻を記録 当たった瞬間の時間を残す
                    alert("あたり!")
                } else if (Math.abs(number - answer) <= 5) { //答えが近ければおしい、遠ければ入力値が答えより大きいか小さいかを教える
                    alert("おしい!")
                } else if (answer < number) {
                    alert("答えより小さい!")
                } else if (answer > number) {
                    alert("答えより大きい!")
                } else { //例外が起きた時はターン数を進めない
                    errorMessage = "0から100までの整数で答えてください"
                    continue
                }

                errorMessage = null //問題がなければエラーは出さない
                turn++
            }

            const deltaTime = (endTime - startTime) / 1000
            //開始時刻と終了時刻の差でクリアにかかった時間を算出 ダイアログが出ている間は他の処理が止まるのでこうすることで確実な経過時間を取得できる

            return deltaTime
        }
        main() //メイン処理は関数にして実行
    </script>
</body>

</html>
